version: '3.8'

networks:
  traefik:
    driver: overlay
    external: true
  backend:
    driver: overlay
    attachable: true

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local
  traefik_certs:
    driver: local

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --api.insecure=false

      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.network=traefik

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https

      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=ishrath.inaam@bevolv.co
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - traefik
    deploy:
      placement:
        constraints:
          - node.role == manager
    labels:
      - traefik.enable=true
      # Redirect HTTP -> HTTPS
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # Dashboard
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      # - traefik.http.services.traefik.loadbalancer.server.port=8080
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      # Basic auth middleware for dashboard
      - "traefik.http.middlewares.traefik-auth.basicauth.users=ishrath:$$apr1$$h4SDjPzz$$Uxkt5ipUX1lsUgEoQUERz1"

  amqp-broker:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_DEFAULT_USER:-guest}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_DEFAULT_PASS:-guest}'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
      - traefik
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.${DOMAIN}`)
      - traefik.http.routers.rabbitmq.entrypoints=websecure
      - traefik.http.routers.rabbitmq.tls.certresolver=letsencrypt
      - traefik.http.services.rabbitmq.loadbalancer.server.port=15672

  ocpp-db:
    image: postgis/postgis:16-3.5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: citrine
      POSTGRES_USER: citrine
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-citrineos}'
      PGPORT: '${BOOTSTRAP_CITRINEOS_DATABASE_PORT:-5432}'
    ports:
      - "5432:5432"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: 'pg_isready --username=citrine'
      interval: 5s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-minioadmin}'
      MINIO_BROWSER_REDIRECT_URL: https://minio.${DOMAIN}
      MINIO_SERVER_URL: https://minio-api.${DOMAIN}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend
      - traefik
    deploy:
      replicas: 1
      labels:
        # MinIO Console
        - traefik.enable=true
        - traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN}`)
        - traefik.http.routers.minio-console.entrypoints=websecure
        - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
        - traefik.http.routers.minio-console.service=minio-console
        - traefik.http.services.minio-console.loadbalancer.server.port=9001
        # MinIO API
        - traefik.http.routers.minio-api.rule=Host(`minio-api.${DOMAIN}`)
        - traefik.http.routers.minio-api.entrypoints=websecure
        - traefik.http.routers.minio-api.tls.certresolver=letsencrypt
        - traefik.http.routers.minio-api.service=minio-api
        - traefik.http.services.minio-api.loadbalancer.server.port=9000
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: none
    entrypoint: >
      /bin/sh -c "
      set -x
      echo 'Setting up MinIO alias'
      mc alias set myminio http://minio:9000 minioadmin minioadmin || echo 'FAILED: alias setup'
      "

  citrine:
    image: ghcr.io/bevolv/citrineos-core/api:${GIT_COMMIT_HASH:-latest}
    environment:
      APP_NAME: 'all'
      APP_ENV: 'docker'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BOOTSTRAP_CITRINEOS_DATABASE_HOST: 'ocpp-db'
      BOOTSTRAP_CITRINEOS_DATABASE_USERNAME: '${BOOTSTRAP_CITRINEOS_DATABASE_USERNAME:-citrine}'
      BOOTSTRAP_CITRINEOS_DATABASE_PASSWORD: '${POSTGRES_PASSWORD:-citrineos}'
      BOOTSTRAP_CITRINEOS_DATABASE_PORT: '${BOOTSTRAP_CITRINEOS_DATABASE_PORT:-5432}'
      BOOTSTRAP_CITRINEOS_CONFIG_FILENAME: 'config.json'
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_TYPE: 'local'
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_LOCAL_DEFAULT_FILE_PATH: '/data'
    networks:
      - backend
      - traefik
    deploy:
      replicas: 2
      labels:
        # Main API
        - traefik.enable=true
        - traefik.http.routers.citrine-api.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.citrine-api.entrypoints=websecure
        - traefik.http.routers.citrine-api.tls.certresolver=letsencrypt
        - traefik.http.routers.citrine-api.service=citrine-api
        - traefik.http.services.citrine-api.loadbalancer.server.port=8080
        # WebSocket endpoint
        - traefik.http.routers.citrine-ws.rule=Host(`ws.${DOMAIN}`)
        - traefik.http.routers.citrine-ws.entrypoints=websecure
        - traefik.http.routers.citrine-ws.tls.certresolver=letsencrypt
        - traefik.http.routers.citrine-ws.service=citrine-ws
        - traefik.http.services.citrine-ws.loadbalancer.server.port=8081
        # OCPP Secure WebSocket
        - traefik.http.routers.citrine-ocpp-secure.rule=Host(`ocpp-secure.${DOMAIN}`)
        - traefik.http.routers.citrine-ocpp-secure.entrypoints=websecure
        - traefik.http.routers.citrine-ocpp-secure.tls.certresolver=letsencrypt
        - traefik.http.routers.citrine-ocpp-secure.service=citrine-ocpp-secure
        - traefik.http.services.citrine-ocpp-secure.loadbalancer.server.port=8443
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  graphql-engine:
    image: hasura/graphql-engine:v2.40.3.cli-migrations-v3
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://citrine:${POSTGRES_PASSWORD}@ocpp-db:5432/citrine
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_DEV_MODE: 'false'  # Set to false for production
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ENABLE_TELEMETRY: 'false'
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET:-supersecret}'  # Set a strong secret
      HASURA_GRAPHQL_METADATA_DEFAULTS: '{"backend_configs":{"dataconnector":{"athena":{"uri":"http://data-connector-agent:8081/api/v1/athena"},"mariadb":{"uri":"http://data-connector-agent:8081/api/v1/mariadb"}}}}'
    networks:
      - backend
      - traefik
    deploy:
      replicas: 2
      labels:
        - traefik.enable=true
        - traefik.http.routers.hasura.rule=Host(`hasura.${DOMAIN}`)
        - traefik.http.routers.hasura.entrypoints=websecure
        - traefik.http.routers.hasura.tls.certresolver=letsencrypt
        - traefik.http.services.hasura.loadbalancer.server.port=8080
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s