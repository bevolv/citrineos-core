networks:
  citrineos-network:
    driver: overlay
    attachable: true
  traefik-network:
    driver: overlay
    external: true

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --api.insecure=false

      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-network
      
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=ishrath.inaam@bevolv.co
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - traefik-network
    deploy:
      placement:
        constraints: [node.role == manager]
    labels:
      - "traefik.enable=true"
      # Redirect HTTP -> HTTPS
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # Dashboard routing
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)" 
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"

      # Basic auth middleware for dashboard
      - "traefik.http.middlewares.traefik-auth.basicauth.users=ishrath:$$apr1$$h4SDjPzz$$Uxkt5ipUX1lsUgEoQUERz1"

  citrineos:
    image: ghcr.io/bevolv/citrineos-core/api:${GIT_COMMIT_HASH:-latest}
    depends_on:
      - postgres
      - amqp-broker
      - redis
      - directus
    environment:
      - APP_ENV=swarm.docker
      - CITRINEOS_util_messageBroker_amqp_url=amqp://guest:guest@amqp-broker:5672
      - CITRINEOS_data_sequelize_host=postgres
      - CITRINEOS_util_cache_redis_host=redis
      - CITRINEOS_util_fileAccess_directus_host=directus
      - BOOTSTRAP_CITRINEOS_DATABASE_HOST=${BOOTSTRAP_CITRINEOS_DATABASE_HOST}
      - BOOTSTRAP_CITRINEOS_DATABASE_PORT=${BOOTSTRAP_CITRINEOS_DATABASE_PORT}
      - BOOTSTRAP_CITRINEOS_DATABASE_NAME=${BOOTSTRAP_CITRINEOS_DATABASE_NAME}
      - BOOTSTRAP_CITRINEOS_DATABASE_DIALECT=${BOOTSTRAP_CITRINEOS_DATABASE_DIALECT}
      - BOOTSTRAP_CITRINEOS_DATABASE_USERNAME=${BOOTSTRAP_CITRINEOS_DATABASE_USERNAME}
      - BOOTSTRAP_CITRINEOS_DATABASE_PASSWORD=${BOOTSTRAP_CITRINEOS_DATABASE_PASSWORD}
    networks:
      - citrineos-network
      - traefik-network
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.citrineos-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.citrineos-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.citrineos-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.citrineos-ws.rule=Host(`ws.${DOMAIN}`)"
      - "traefik.http.routers.citrineos-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.citrineos-ws.loadbalancer.server.port=8081"
      - "traefik.http.routers.citrineos-ws-auth.rule=Host(`ws-auth.${DOMAIN}`)"
      - "traefik.http.routers.citrineos-ws-auth.tls.certresolver=letsencrypt"
      - "traefik.http.services.citrineos-ws-auth.loadbalancer.server.port=8082"

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=citrine
      - POSTGRES_USER=citrine
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-citrineos}
      - PGPORT=${BOOTSTRAP_CITRINEOS_DATABASE_PORT:-5433}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - citrineos-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  amqp-broker:
    image: rabbitmq:3.12-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - citrineos-network
      - traefik-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.${DOMAIN}`)"
      - "traefik.http.routers.rabbitmq.tls.certresolver=letsencrypt"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  redis:
    image: redis:7-alpine
    networks:
      - citrineos-network
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  directus:
    image: directus/directus:10.8.3
    depends_on:
      - directus-db
    environment:
      - KEY=${DIRECTUS_KEY}
      - SECRET=${DIRECTUS_SECRET}
      - DB_CLIENT=pg
      - DB_HOST=directus-db
      - DB_PORT=5432
      - DB_DATABASE=directus
      - DB_USER=directus
      - DB_PASSWORD=${DIRECTUS_DB_PASSWORD:-directus}
      - ADMIN_EMAIL=admin@citrineos.com
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD:-admin}
      - PUBLIC_URL=https://directus.${DOMAIN}
    volumes:
      - directus-uploads:/directus/uploads
    networks:
      - citrineos-network
      - traefik-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.directus.rule=Host(`directus.${DOMAIN}`)"
      - "traefik.http.routers.directus.tls.certresolver=letsencrypt"
      - "traefik.http.services.directus.loadbalancer.server.port=8055"

  directus-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=directus
      - POSTGRES_USER=directus
      - POSTGRES_PASSWORD=${DIRECTUS_DB_PASSWORD:-directus}
    volumes:
      - directus-database:/var/lib/postgresql/data
    networks:
      - citrineos-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

volumes:
  traefik-letsencrypt:
  postgres-data:
  rabbitmq-data:
  redis-data:
  directus-uploads:
  directus-database: